[package]
name = "mosimage"
version = "0.1.0"
description = "Local AI image generation and inpainting"
authors = ["MosImage contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
percent-encoding = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

# The UI is embedded in this crate, so every UI change recompiles it; incremental
# builds reuse the rest and take seconds instead of half a minute. Dependencies
# are never incremental and keep their full release optimisation.
[profile.release]
incremental = true
